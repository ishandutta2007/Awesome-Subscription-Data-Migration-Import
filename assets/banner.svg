<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0f1d; border-radius:12px; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b33" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.28; }
      }
      @keyframes floatParticle1 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes floatParticle2 {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
        50% { transform: translateY(20px) translateX(-20px); opacity: 0.9; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      }
      @keyframes dataFlow {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #38bdf8); }
        50% { transform: scale(1.15); filter: drop-shadow(0 0 10px #818cf8); }
      }
      @keyframes orbFloat {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-30px, 20px) scale(1.08); }
      }

      .grid-layer { animation: pulseGrid 6s ease-in-out infinite; }
      .p1 { animation: floatParticle1 7s ease-in-out infinite; }
      .p2 { animation: floatParticle2 9s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 12, 12; animation: dataFlow 3s linear infinite; }
      .node-anim { transform-box: fill-box; transform-origin: center; animation: nodePulse 3s ease-in-out infinite; }
      .bg-orb { animation: orbFloat 10s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="12" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="bg-orb" opacity="0.35">
    <circle cx="200" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1020" cy="260" r="160" fill="#818cf8" filter="url(#glow)" />
    <circle cx="620" cy="320" r="110" fill="#c084fc" filter="url(#glow)" />
  </g>

  <!-- Technical Grid Matrix -->
  <g class="grid-layer" stroke="#38bdf8" stroke-width="0.75">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="1160" y1="0" x2="1160" y2="360" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Dynamic Data Pipeline / Migration Streams (Background to Text) -->
  <g opacity="0.6">
    <path class="flow-line" d="M 60 70 C 300 30, 500 120, 800 60 C 950 30, 1050 90, 1140 70" fill="none" stroke="#38bdf8" stroke-width="3" />
    <path class="flow-line" d="M 60 300 C 250 330, 480 250, 720 300 C 900 340, 1050 280, 1140 310" fill="none" stroke="#c084fc" stroke-width="3" />
    <path class="flow-line" d="M 100 200 C 350 170, 750 210, 1100 180" fill="none" stroke="#818cf8" stroke-width="2" />
  </g>

  <!-- Ambient Dynamic Floating Tech Dots -->
  <g class="p1">
    <circle cx="160" cy="80" r="3" fill="#38bdf8" />
    <circle cx="860" cy="110" r="4" fill="#818cf8" />
    <circle cx="1080" cy="210" r="3" fill="#c084fc" />
    <circle cx="280" cy="290" r="3.5" fill="#38bdf8" />
  </g>
  <g class="p2">
    <circle cx="340" cy="90" r="3.5" fill="#c084fc" />
    <circle cx="680" cy="50" r="2.5" fill="#38bdf8" />
    <circle cx="980" cy="290" r="4" fill="#38bdf8" />
    <circle cx="480" cy="310" r="3" fill="#818cf8" />
  </g>

  <!-- Foreground Content Container (Card Backplate for High Contrast & Readability) -->
  <rect x="70" y="45" width="1060" height="270" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Decorative Corner Accents on Card -->
  <path d="M 70 75 L 70 45 L 100 45" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 1130 75 L 1130 45 L 1100 45" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 70 285 L 70 315 L 100 315" fill="none" stroke="#818cf8" stroke-width="3" />
  <path d="M 1130 285 L 1130 315 L 1100 315" fill="none" stroke="#c084fc" stroke-width="3" />

  <!-- Top Pill / Badge -->
  <g transform="translate(105, 72)">
    <rect width="320" height="28" rx="14" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1" />
    <circle class="node-anim" cx="16" cy="14" r="5" fill="#38bdf8" />
    <text x="32" y="19" fill="#e0f2fe" font-size="12" font-weight="700" letter-spacing="1.2">ZERO-DOWNTIME DATA MIGRATION</text>
  </g>

  <!-- Secondary Live Migration Badge -->
  <g transform="translate(440, 72)">
    <rect width="210" height="28" rx="14" fill="#4338ca" fill-opacity="0.4" stroke="#818cf8" stroke-width="1" />
    <circle class="node-anim" cx="16" cy="14" r="5" fill="#a5b4fc" />
    <text x="30" y="19" fill="#e0e7ff" font-size="12" font-weight="700" letter-spacing="1">ELT &bull; CDC &bull; BILLING APIS</text>
  </g>

  <!-- Title in Foreground -->
  <text x="105" y="152" fill="url(#textGrad)" font-size="42" font-weight="900" letter-spacing="-0.5">Awesome Subscription Data Migration</text>

  <!-- Subtitle in Foreground -->
  <text x="105" y="192" fill="#f8fafc" font-size="20" font-weight="600">Enterprise Database Replication, Billing Semantics &amp; Automated Ingestion</text>

  <!-- Third Line Description / Features -->
  <text x="105" y="224" fill="#94a3b8" font-size="14.5" font-weight="400">
    Curated architectures, token vaults (PCI-DSS), live CDC streams, schema mapping &amp; cloud data warehouses.
  </text>

  <!-- Interactive / Decorative Tech Pills along Bottom of Card -->
  <g transform="translate(105, 252)">
    <!-- Pill 1 -->
    <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="65" y="22" fill="#38bdf8" font-size="12.5" font-weight="700" text-anchor="middle">⚡ Real-time CDC</text>

    <!-- Pill 2 -->
    <rect x="145" width="145" height="34" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="217" y="22" fill="#a5b4fc" font-size="12.5" font-weight="700" text-anchor="middle">🔒 Token Vaults</text>

    <!-- Pill 3 -->
    <rect x="305" width="150" height="34" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <text x="380" y="22" fill="#e9d5ff" font-size="12.5" font-weight="700" text-anchor="middle">🔄 Schema Drift</text>

    <!-- Pill 4 -->
    <rect x="470" width="175" height="34" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <text x="557" y="22" fill="#6ee7b7" font-size="12.5" font-weight="700" text-anchor="middle">📊 Proration Preserved</text>

    <!-- Pill 5 -->
    <rect x="660" width="140" height="34" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
    <text x="730" y="22" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">🚀 700+ Connectors</text>
  </g>
</svg>
