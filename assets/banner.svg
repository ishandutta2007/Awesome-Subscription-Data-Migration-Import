<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 40px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 19px;
        fill: #f1f5f9;
      }
      .desc-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 14px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 12px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 1px;
      }

      /* CSS animations */
      @keyframes flowDash {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { opacity: 0.3; r: 3px; }
        50% { opacity: 1; r: 6px; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px); opacity: 0.3; }
        50% { transform: translateY(-12px); opacity: 0.9; }
      }
      @keyframes gridPulse {
        0%, 100% { opacity: 0.08; }
        50% { opacity: 0.22; }
      }

      .animated-stream {
        stroke-dasharray: 12, 12;
        animation: flowDash 4s linear infinite;
      }
      .pulsing-dot {
        animation: pulseNode 3s ease-in-out infinite;
      }
      .floating-particle {
        animation: floatParticle 5s ease-in-out infinite;
      }
      .grid-lines {
        animation: gridPulse 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="16" />

  <!-- Ambient Background Glow Nodes (Pure Vector, No complex filters) -->
  <circle cx="150" cy="80" r="130" fill="#0369a1" opacity="0.18" />
  <circle cx="1060" cy="280" r="140" fill="#6d28d9" opacity="0.18" />
  <circle cx="620" cy="340" r="100" fill="#4338ca" opacity="0.12" />

  <!-- Technical Circuit Grid -->
  <g class="grid-lines" stroke="#38bdf8" stroke-width="0.75">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="1160" y1="0" x2="1160" y2="360" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Flowing Dynamic Streams -->
  <g opacity="0.65">
    <path class="animated-stream" d="M 40 80 C 260 20, 520 140, 840 50 C 980 10, 1080 80, 1160 60" fill="none" stroke="url(#streamGrad1)" stroke-width="2.5" />
    <path class="animated-stream" d="M 40 300 C 260 340, 500 240, 780 310 C 940 350, 1060 280, 1160 300" fill="none" stroke="url(#streamGrad2)" stroke-width="2.5" />
  </g>

  <!-- Dynamic Animated Micro Particles -->
  <circle class="floating-particle" cx="120" cy="110" r="3" fill="#38bdf8" />
  <circle class="floating-particle" cx="290" cy="50" r="2.5" fill="#818cf8" />
  <circle class="floating-particle" cx="950" cy="40" r="3" fill="#38bdf8" />
  <circle class="floating-particle" cx="1090" cy="130" r="2.5" fill="#c084fc" />
  <circle class="floating-particle" cx="1120" cy="270" r="3" fill="#818cf8" />
  <circle class="floating-particle" cx="240" cy="320" r="2.5" fill="#38bdf8" />

  <!-- Shadow Vector Layer for Foreground Card -->
  <rect x="73" y="47" width="1054" height="266" rx="16" fill="#000000" opacity="0.55" />

  <!-- Foreground Content Card -->
  <rect x="70" y="44" width="1060" height="272" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Corner Accents -->
  <path d="M 70 74 L 70 44 L 100 44" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 1130 74 L 1130 44 L 1100 44" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 70 286 L 70 316 L 100 316" fill="none" stroke="#818cf8" stroke-width="2.5" />
  <path d="M 1130 286 L 1130 316 L 1100 316" fill="none" stroke="#c084fc" stroke-width="2.5" />

  <!-- Header Badges inside Card -->
  <g transform="translate(105, 68)">
    <rect width="250" height="26" rx="13" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <circle class="pulsing-dot" cx="14" cy="13" r="4.5" fill="#38bdf8" />
    <text class="badge-text" x="27" y="17" fill="#e0f2fe">ZERO-DOWNTIME MIGRATION</text>
  </g>

  <g transform="translate(370, 68)">
    <rect width="230" height="26" rx="13" fill="#4f46e5" fill-opacity="0.25" stroke="#818cf8" stroke-width="1" />
    <circle class="pulsing-dot" cx="14" cy="13" r="4.5" fill="#a5b4fc" />
    <text class="badge-text" x="27" y="17" fill="#e0e7ff">ELT &bull; CDC &bull; BILLING APIS</text>
  </g>

  <!-- Title & Subtitle in Foreground -->
  <text class="title-text" x="105" y="142" fill="url(#textGrad)">Awesome Subscription Data Migration</text>
  <text class="subtitle-text" x="105" y="180">Enterprise Database Replication, Billing Semantics &amp; Automated Ingestion</text>
  <text class="desc-text" x="105" y="210">Curated architectures, token vaults (PCI-DSS), live CDC streams, schema mapping &amp; cloud data warehouses.</text>

  <!-- Interactive / Informational Feature Pills along Bottom -->
  <g transform="translate(105, 240)">
    <!-- Pill 1 -->
    <rect width="130" height="34" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <text class="pill-text" x="65" y="21" fill="#38bdf8" text-anchor="middle">&#x26A1; Real-time CDC</text>

    <!-- Pill 2 -->
    <rect x="145" width="145" height="34" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
    <text class="pill-text" x="217" y="21" fill="#a5b4fc" text-anchor="middle">&#x1F512; Token Vaults</text>

    <!-- Pill 3 -->
    <rect x="305" width="150" height="34" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
    <text class="pill-text" x="380" y="21" fill="#e9d5ff" text-anchor="middle">&#x1F504; Schema Drift</text>

    <!-- Pill 4 -->
    <rect x="470" width="175" height="34" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1" />
    <text class="pill-text" x="557" y="21" fill="#6ee7b7" text-anchor="middle">&#x1F4CA; Proration Preserved</text>

    <!-- Pill 5 -->
    <rect x="660" width="145" height="34" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="1" />
    <text class="pill-text" x="732" y="21" fill="#fde68a" text-anchor="middle">&#x1F680; 700+ Connectors</text>
  </g>
</svg>
