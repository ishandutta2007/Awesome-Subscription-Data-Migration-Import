<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Radial Glow for Architecture Node Network -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    /* CSS Animations for Dynamic Aspects */
    @keyframes pulseGlow {
      0% { transform: scale(0.98); opacity: 0.4; }
      50% { transform: scale(1.04); opacity: 0.8; }
      100% { transform: scale(0.98); opacity: 0.4; }
    }

    @keyframes scanBeam {
      0% { transform: translateY(-100px); opacity: 0; }
      30% { opacity: 0.6; }
      70% { opacity: 0.6; }
      100% { transform: translateY(320px); opacity: 0; }
    }

    @keyframes nodeFloat {
      0% { transform: translate(0, 0); }
      50% { transform: translate(5px, -8px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }

    .glow-circle {
      transform-origin: 920px 160px;
      animation: pulseGlow 6s ease-in-out infinite;
    }

    .scanner-line {
      animation: scanBeam 7s linear infinite;
    }

    .animated-node {
      animation: nodeFloat 4s ease-in-out infinite;
    }

    .pulse-ring {
      animation: dashMove 3s linear infinite;
    }

    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: url(#titleGrad);
    }

    .subtitle-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }

    .badge-tag {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="12" />
  <rect width="1200" height="320" fill="url(#grid)" rx="12" />

  <!-- Dynamic Animated Scanline Beam (in Background) -->
  <g opacity="0.4">
    <line class="scanner-line" x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="3" />
  </g>

  <!-- Right Side Graphic: Data Pipeline & Token Vault Synchronization Hub -->
  <g transform="translate(70, 0)">
    <!-- Radial Ambient Glow -->
    <circle class="glow-circle" cx="920" cy="160" r="160" fill="url(#glowGrad)" />

    <!-- Outer Pulsing Orbit Rings -->
    <circle class="pulse-ring" cx="920" cy="160" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.5" />
    <circle cx="920" cy="160" r="80" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />

    <!-- Connecting Migration Signal Lines -->
    <path d="M 840 115 L 920 160 L 1000 105 M 920 160 L 985 220 M 920 160 L 850 215" fill="none" stroke="#334155" stroke-width="2" />

    <!-- Floating Node 1: Payment Vault -->
    <g class="animated-node">
      <circle cx="840" cy="115" r="6" fill="#38bdf8" />
      <text x="755" y="100" class="badge-tag" font-size="11">Token Vault</text>
    </g>

    <!-- Floating Node 2: CDC Sync -->
    <g class="animated-node" style="animation-delay: -1s;">
      <circle cx="1000" cy="105" r="6" fill="#818cf8" />
      <text x="990" y="90" class="badge-tag" font-size="11">Live CDC Sync</text>
    </g>

    <!-- Floating Node 3: Billing Catalog -->
    <g class="animated-node" style="animation-delay: -2s;">
      <circle cx="985" cy="220" r="6" fill="#c084fc" />
      <text x="975" y="242" class="badge-tag" font-size="11">Plan Catalog</text>
    </g>

    <!-- Floating Node 4: Warehouses -->
    <g class="animated-node" style="animation-delay: -3s;">
      <circle cx="850" cy="215" r="6" fill="#4ade80" />
      <text x="795" y="235" class="badge-tag" font-size="11">ELT &amp; ETL</text>
    </g>

    <!-- Center Migration Engine Hub -->
    <g transform="translate(920, 160) scale(1.15)">
      <!-- Outer Hex/Diamond Container -->
      <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
      <!-- Inner Exchange Arrows -->
      <path d="M -12 -8 L 12 -8 M 6 -14 L 12 -8 L 6 -2" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 12 8 L -12 8 M -6 2 L -12 8 L -6 14" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Left Side Text (Foreground Content - Guaranteed Unobscured) -->
  <g transform="translate(60, 0)">
    <!-- Top Category Pill -->
    <rect x="0" y="52" width="295" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" />
    <text x="14" y="71" class="badge-tag">🔄 ZERO-DOWNTIME DATA MIGRATION</text>

    <!-- Main Title -->
    <text x="0" y="128" class="title-text">Awesome Subscription Migration</text>

    <!-- Subtitle -->
    <text x="0" y="168" class="subtitle-text">Curated Database Replication, Change Data Capture,</text>
    <text x="0" y="196" class="subtitle-text">Payment Token Portability &amp; Automated ELT Pipelines</text>

    <!-- Bottom Feature Tags -->
    <g transform="translate(0, 228)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="17" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500">⚡ Real-time CDC</text>

      <rect x="140" y="0" width="130" height="26" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="152" y="17" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500">🔒 Token Vaults</text>

      <rect x="280" y="0" width="140" height="26" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="292" y="17" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500">🔄 Schema Drift</text>

      <rect x="430" y="0" width="160" height="26" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="442" y="17" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500">📊 Proration Preserved</text>
    </g>
  </g>
</svg>
